steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/aqruntime-workdoc:$SHORT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/aqruntime-workdoc:$SHORT_SHA
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/aqruntime-workdoc:$SHORT_SHA
substitutions:
  _REGION: asia-southeast2
  _AR_REPOSITORY: aqruntime
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
